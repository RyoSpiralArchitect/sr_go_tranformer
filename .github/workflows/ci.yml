name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go ${{ matrix.go }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: '1.22.x'
          - os: ubuntu-latest
            go: stable
          # macOS 26 requires Mach-O metadata that Go 1.22 does not emit.
          - os: macos-latest
            go: stable
    env:
      GOMAXPROCS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l monolith.go monolith_test.go)"
      - name: Test with race detection
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Build without cgo
        run: CGO_ENABLED=0 go build -trimpath -o monolith .
      - name: Exercise CLI and deterministic resume
        run: ./scripts/smoke.sh
